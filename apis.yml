aid: acerna
name: aceRNA Technologies
description: >-
  aceRNA Technologies Co., Ltd. is a Japanese biotechnology venture founded in April 2018 to
  commercialize the RNA design technology ("RNA Switch") developed in the synthetic RNA biology
  laboratory of Prof. Hirohide Saito at Kyoto University. An RNA Switch is embedded into a
  messenger RNA so that expression of the therapeutic transgene is gated by the activity of a
  specific microRNA inside the cell, letting a treatment act only on the cell type and cell state
  that is diseased. The company applies the platform across mRNA medicines, cell therapy and gene
  therapy, co-develops with partners (an agreement with Nitto Denko was announced in December
  2021), and closed a JPY 960M Series B in May 2024 led by DCI Partners. It is headquartered at
  the University of Tokyo Entrepreneur Plaza. aceRNA runs no developer programme and publishes no
  API reference, OpenAPI or SDK; the only machine-readable surfaces on its domain are the
  Wix-platform llms.txt and Site MCP endpoint, both captured here.
