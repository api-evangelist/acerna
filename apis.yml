apis:
- aid: acerna:site-mcp
  name: aceRNA Technologies Site MCP
  description: >-
    A live, anonymously reachable Model Context Protocol endpoint served from aceRNA Technologies'
    own host and advertised in the site's llms.txt. It is provided by the Wix platform, not built
    by aceRNA — it exposes generic Wix site tools (business details, in-site search, site API doc
    search, anonymous visitor-token issuance and a Wix REST API call/execute bridge) over the
    public content of www.acernatec.com. A tools/list call returns 9 tools with real JSON Schema
    inputs. There is no aceRNA-authored API behind it.
