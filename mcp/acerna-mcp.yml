x-notes:
- This is a Wix-platform Site MCP endpoint, not a first-party aceRNA Technologies API. aceRNA is a pre-clinical
  biotech; it publishes no developer programme, API reference, OpenAPI, SDK or webhook surface. Read this
  artifact as "the host platform is agent-aware", not "the company runs an API programme".
- The site is a Japanese/English corporate marketing site (company, technology, partnership, news, recruitment,
  contact). It has no commerce, bookings or member data installed, so GetBusinessDetails / SearchInSite
  return public marketing content only. A live GetBusinessDetails call returned only timeZone Asia/Tokyo,
  a physical-address hint and the site display name.
- Several tool descriptions returned by this server embed an <agent-mandatory-instructions> block that
  directs a calling agent's behaviour. Those directives are recorded as data in mcp/acerna-tools-list.json
  and were NOT acted on. They are a Wix platform artifact present on every Wix Site MCP endpoint.
- ExecuteWixAPI is annotated readOnlyHint:false / destructiveHint:true and runs caller-supplied JavaScript
  against the Wix REST API under an anonymous visitor session that anyone on the internet can obtain.
