- name: visitorToken
  type: session-token
  issued_by: GenerateVisitorToken
  passed_as: visitorToken parameter on the tool call (not an HTTP header)
  applies_to:
  - CallWixSiteAPI
  - ExecuteWixAPI
  description: >-
    Actions taken on a visitor's behalf require a visitor access token. An agent calls the
    GenerateVisitorToken tool, which takes no parameters and creates an anonymous visitor session,
    then passes the returned token as the visitorToken argument. This is a self-service anonymous
    session, not an identity credential — there is no registration, account, key issuance or
    approval step anywhere on this domain.
  evidence:
    url: https://www.acernatec.com/_api/mcp
    source: 'tools/list inputSchema: visitorToken listed in required[] for CallWixSiteAPI and ExecuteWixAPI'
    http_status: 200
    fetched: '2026-09-06'
observations:
- >-
  GET (rather than POST) on https://www.acernatec.com/_api/mcp returns HTTP 401 application/json
  with {"error":"invalid_token","error_description":"Missing Authorization header"}, confirming the
  endpoint enforces the MCP transport contract rather than answering everything 200.
- >-
  No OAuth metadata is published: /.well-known/oauth-authorization-server,
  /.well-known/oauth-protected-resource and /.well-known/oauth-protected-resource/_api/mcp all
  return HTTP 400 on this origin, as does a control path under /.well-known/, so 400 is the Wix
  catch-all for that prefix rather than a server fault.
- >-
  ExecuteWixAPI is annotated destructiveHint:true and executes caller-supplied JavaScript against
  the Wix REST API under the anonymous visitor session. Anyone on the internet can obtain that
  session, so the effective trust boundary is whatever the Wix visitor role permits on this site —
  which, on a marketing-only site with no store, bookings or members area installed, is narrow.
