  type: none
  applies_to:
  - 'MCP method: tools/list'
  - 'MCP method: tools/call (GetBusinessDetails, SearchInSite, SearchSiteApiDocs, GenerateVisitorToken)'
  description: >-
    Discovery is unauthenticated. POST tools/list to https://www.acernatec.com/_api/mcp with no
    credentials returns HTTP 200 and the full 9-tool manifest with JSON Schema inputs. A
    tools/call of GetBusinessDetails with no credentials also returned 200.
