standards:
- id: mcp
  name: Model Context Protocol
  conforms: true
  evidence: >-
    POST https://www.acernatec.com/_api/mcp with method tools/list returned HTTP 200 and a valid
    JSON-RPC 2.0 result containing 9 tools, each with a JSON Schema inputSchema. The server issued
    an mcp-session-id response header.
- id: jsonrpc-2.0
  name: JSON-RPC 2.0
  conforms: true
  evidence: The MCP endpoint accepts and answers JSON-RPC 2.0 envelopes (id and jsonrpc echoed on the result).
- id: llmstxt
